root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/subscription-aggregator ./cmd/subscription-aggregator"
bin = "./tmp/subscription-aggregator"

include_ext = ["go", "env"]
exclude_dir = ["tmp", "vendor", ".git"]
exclude_regex = ["_test\\.go"]

delay = 1000
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true